<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Vansh Kalra — Personal Branding SVG</title>
  <desc>Minimal gradient nameplate for Vansh Kalra, with a tagline.</desc>

  <defs>
    <!-- Neutral gray gradient -->
    <linearGradient id="grayGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4b5563"></stop>
      <stop offset="50%" stop-color="#9ca3af"></stop>
      <stop offset="100%" stop-color="#d1d5db"></stop>
    </linearGradient>

    <!-- Subtle shadow for depth -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"></feDropShadow>
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="transparent"></rect>

  <!-- Name -->
  <g transform="translate(600,130)" filter="url(#softShadow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="72" letter-spacing="-0.02em" fill="url(#grayGradient)" dominant-baseline="central">
      Vansh Kalra
    </text>
  </g>

  <!-- Divider line (optional subtle accent) -->
  <line x1="420" x2="780" y1="165" y2="165" stroke="#e5e7eb" stroke-width="1" opacity="0.4"></line>

  <!-- Tagline -->
  <text x="600" y="205" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="18" fill="#6b7280" letter-spacing="0.1">
    The kind of talent you want on your engineering team
  </text>
</svg>
